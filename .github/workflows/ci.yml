name: Integracion continua

on:
  push:
    branches: [main, practica-submodules]
  pull_request:
    branches: [main, practica-submodules]

jobs:
  pruebas:
    name: pruebas
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio y submodulos privados
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.BACKEND_SUBMODULE_TOKEN }}
          submodules: recursive
          persist-credentials: true

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Instalar dependencias Node.js
        run: npm ci

      - name: Instalar Spectral
        run: npm install -g @stoplight/spectral-cli

      - name: Validar contrato OpenAPI
        run: spectral lint api/openapi.yaml

      - name: Analisis estatico con Ruff
        run: ruff check src tests backend

      - name: Ejecutar pruebas Python
        run: pytest -v

      - name: Ejecutar pruebas BDD con Cucumber
        run: npm test
